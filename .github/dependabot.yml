version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # React Native requires its Jest preset to match the runtime version exactly.
    groups:
      react-native:
        patterns:
          - react-native
          - '@react-native/*'
    ignore:
      - dependency-name: '@babel/preset-env'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
