version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep the runtime, React, renderer, and Jest preset compatible together.
    groups:
      react-native:
        patterns:
          - react-native
          - react
          - react-test-renderer
          - '@react-native/*'
    ignore:
      # The React Native lint preset currently supports ESLint 8 and 9.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # Babel preset-env 7 requires Babel core 7.
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']
      - dependency-name: '@babel/preset-env'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
